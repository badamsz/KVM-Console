# Builds KVM Console in Release and publishes it.
#
#   Pull requests, pushes to main  unsigned (ad-hoc) build, kept as a workflow artifact.
#   Tags v*, manual runs            Developer ID signed and notarized when the signing
#                                   secrets exist; a tag also creates a GitHub Release.
#
# Secrets (Settings > Secrets and variables > Actions); see README "Release builds":
#   APPLE_TEAM_ID                      10-character team ID
#   MACOS_CERTIFICATE_P12_BASE64       "Developer ID Application" certificate + key, .p12, base64
#   MACOS_CERTIFICATE_PASSWORD         password of that .p12
#   NOTARY_API_KEY_P8_BASE64           App Store Connect API key (.p8), base64
#   NOTARY_API_KEY_ID                  that key's ID
#   NOTARY_API_ISSUER_ID               issuer ID shown above the keys list
name: Release build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Sign only builds people download: tags and manual runs.
      WANT_SIGNING: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
      WANT_NOTARY: ${{ secrets.NOTARY_API_KEY_P8_BASE64 != '' && secrets.NOTARY_API_KEY_ID != '' && secrets.NOTARY_API_ISSUER_ID != '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.result.outputs.signed }}
      notarized: ${{ steps.result.outputs.notarized }}
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Work out the version
        id: version
        run: |
          base="$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' project.yml | head -n 1)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            marketing="${version%%-*}"   # 1.2.0-beta.1 -> 1.2.0 in Info.plist
          else
            marketing="${base:-0.0.0}"
            version="$marketing-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "marketing=$marketing" >> "$GITHUB_OUTPUT"
          echo "Version $version (CFBundleShortVersionString $marketing, build $GITHUB_RUN_NUMBER)"

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Archive (Release)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project KVMConsole.xcodeproj \
            -scheme KVMConsole \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/KVMConsole.xcarchive \
            MARKETING_VERSION='${{ steps.version.outputs.marketing }}' \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Import the Developer ID certificate
        id: cert
        if: env.WANT_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" -A
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" -A \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          # shellcheck disable=SC2046  # one keychain path per word
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep "Developer ID Application" | grep "($TEAM_ID)" | head -n 1 | awk '{print $2}')"
          if [[ -z "$identity" ]]; then
            echo "::error::No 'Developer ID Application' identity for team $TEAM_ID in the .p12"
            security find-identity -v -p codesigning "$keychain"
            exit 1
          fi
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Write the notary API key
        id: notary
        if: env.WANT_SIGNING == 'true' && env.WANT_NOTARY == 'true'
        env:
          KEY_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          path="$RUNNER_TEMP/notary_key.p8"
          echo "$KEY_BASE64" | base64 --decode > "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Sign, notarize and package
        env:
          APP: "build/KVMConsole.xcarchive/Products/Applications/KVM Console.app"
          VERSION: ${{ steps.version.outputs.version }}
          SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
          KEYCHAIN: ${{ steps.cert.outputs.keychain }}
          NOTARY_KEY_PATH: ${{ steps.notary.outputs.path }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: scripts/ci/package.sh

      - name: Record what was done
        id: result
        run: |
          signed=false; notarized=false
          [[ -n "${{ steps.cert.outputs.identity }}" ]] && signed=true
          [[ -n "${{ steps.notary.outputs.path }}" ]] && notarized=true
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "notarized=$notarized" >> "$GITHUB_OUTPUT"
          {
            echo "### KVM Console ${{ steps.version.outputs.version }}"
            echo "- Developer ID signed: $signed"
            echo "- Notarized: $notarized"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: KVMConsole-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Clean up signing material
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          fi
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary_key.p8"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: KVMConsole-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          SIGNED: ${{ needs.build.outputs.signed }}
          NOTARIZED: ${{ needs.build.outputs.notarized }}
        run: |
          {
            if [[ "$NOTARIZED" == true ]]; then
              echo "Signed with Developer ID and notarized by Apple. Open the .dmg and drag KVM Console to Applications."
            else
              echo "**This build is not notarized.** macOS will block the first launch. Open it once, then go to System Settings > Privacy & Security and click **Open Anyway**."
            fi
          } > notes.md
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "KVM Console $VERSION" \
              --notes-file notes.md --generate-notes \
              --verify-tag "${prerelease[@]}"
          fi
