# Unit tests: KVMKit (Swift) and the on-device configuration helper (Python).
# The app itself is built by release.yml.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kvmkit:
    name: KVMKit (swift test)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Test
        run: swift test --package-path Packages/KVMKit

  config-helper:
    name: Config helper (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ruamel.yaml pyyaml
      - name: Test
        run: python3 -m unittest discover -s Packages/KVMKit/Tests/HelperTests -v
