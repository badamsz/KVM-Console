# Generate PiKVMConsole.xcodeproj with:  xcodegen generate
name: PiKVMConsole
options:
  bundleIdPrefix: com.badamsz
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
# Signing identity and team come from Config/Local.xcconfig when it exists.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  PiKVMKit:
    path: Packages/PiKVMKit
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 157.0.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PiKVMConsole:
    type: application
    platform: macOS
    sources:
      - PiKVMConsole
    dependencies:
      - package: PiKVMKit
      - package: WebRTC
    info:
      path: PiKVMConsole/Info.plist
      properties:
        CFBundleDisplayName: PiKVM Console
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: PiKVM Console connects to PiKVM devices on your local network and can search it for KVMs.
        # Bonjour types browsed by Find Devices (see BonjourBrowser.serviceTypes).
        NSBonjourServices:
          - _pikvm._tcp
          - _https._tcp
          - _http._tcp
          - _ssh._tcp
        # A Sipeed NanoKVM serves plain HTTP unless HTTPS is turned on in its
        # settings. Allow HTTP only to local names (.local, bare host names;
        # IP addresses aren't subject to ATS) and to Tailscale MagicDNS names.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        NSMicrophoneUsageDescription: PiKVM Console sends your microphone to the remote machine when you turn on Send Microphone in a console.
        NSCameraUsageDescription: PiKVM Console sends your camera to the remote machine when you turn on Send Camera in a console.
    entitlements:
      path: PiKVMConsole/PiKVMConsole.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # WebRTC receives media on UDP ports it opens itself.
        com.apple.security.network.server: true
        # Microphone and camera passthrough to the remote machine.
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
        # Reading ISO and disk images the user picks for upload.
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.badamsz.PiKVMConsole
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: $(PIKVM_CODE_SIGN_IDENTITY)
schemes:
  PiKVMConsole:
    build:
      targets:
        PiKVMConsole: all
    test:
      targets:
        - package: PiKVMKit/PiKVMKitTests
